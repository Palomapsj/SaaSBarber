@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap');

:root, [data-theme="dark"] {
  --bg: #121212; --card:#1D1D1D; --card2:#242424; --text:#F2F2F2; --muted:#9A9A9A; --muted2:#6E6E6E;
  --border:#2C2C2C; --accent:#E3242B; --accent-soft:rgba(227,36,43,0.16); --on-accent:#FFFFFF;
  --success:#3DDC84; --success-soft:rgba(61,220,132,0.16);
}
[data-theme="light"] {
  --bg:#F7F5F2; --card:#FFFFFF; --card2:#F0ECE7; --text:#1A1816; --muted:#6E6862; --muted2:#9C948C;
  --border:#E4DED6; --accent:#E3242B; --accent-soft:rgba(227,36,43,0.10); --on-accent:#FFFFFF;
  --success:#1D9A5C; --success-soft:rgba(29,154,92,0.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body { font-family: 'Work Sans', system-ui, sans-serif; color: var(--text); }
a { color: var(--accent); text-decoration: none; }
button { font-family: 'Work Sans', system-ui, sans-serif; cursor: pointer; }
input, select { font-family: 'Work Sans', system-ui, sans-serif; }

/* mobile (client) pages: full height, centered column on wide viewports */
.mobile-page { min-height: 100vh; width: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; }
@media (min-width: 481px) {
  .mobile-page { min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.25); }
}

/* desktop (admin/barbeiro) pages */
.desktop-page { min-height: 100vh; width: 100%; background: var(--bg); display: flex; }

/* theme toggle sun/moon visibility */
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="light"] .icon-sun { display: none; }

.link-btn { display:block; text-align:center; }

</style>
